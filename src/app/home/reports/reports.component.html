<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 flex-grow-1 text-center">Reports</h2>
        <button class="btn btn-outline-info ms-2" (click)="onNavigateHome()" title="Home">
            <i class="bi bi-house-door"></i>
        </button>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form class="row g-3 align-items-end">
                <div class="col-12 col-md-5">
                    <label for="reportType" class="form-label fw-semibold">Select Report Type</label>
                    <select id="reportType" class="form-select" [(ngModel)]="selectedReportType" name="reportType"
                                    (change)="onReportTypeChange()">
                        <option value="" disabled selected>Select</option>
                        <option *ngFor="let type of reportTypes" [value]="type.value">{{ type.label }}</option>
                    </select>
                </div>
                <div class="col-6 col-md-3 d-grid">
                    <button class="btn btn-primary" type="button" (click)="onSearch()"
                                    [disabled]="!selectedReportType || loading">
                        <i class="bi bi-search me-1"></i> Search
                    </button>
                </div>
                <div class="col-6 col-md-3 d-grid">
                    <button class="btn btn-success" type="button" (click)="downloadExcel()" [disabled]="!reportData.length">
                        <i class="bi bi-file-earmark-excel me-1"></i> Download Excel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div *ngIf="loading" class="text-center my-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

        <div class="card shadow-sm border-0" *ngIf="reportData.length">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-striped align-middle mb-0" style="min-width: 700px;">
                        <thead class="table-light sticky-top" style="z-index:1;">
                                                        <tr>
                                                            <th *ngFor="let col of columns" class="text-nowrap text-center fw-semibold position-relative" style="background: #f8f9fa;">
                                                                <div class="d-flex align-items-center justify-content-center">
                                                                    <span>{{ col | titlecaseWithSpaces }}</span>
                                                                    <button type="button" class="btn btn-link btn-sm p-0 ms-1" tabindex="-1" style="line-height:1;" (click)="$event.stopPropagation(); showFilter[col]=!showFilter[col]">
                                                                        <i class="bi bi-funnel" [ngClass]="{'text-primary': showFilter[col]}"></i>
                                                                    </button>
                                                                </div>
                                                                <div *ngIf="showFilter[col]" class="position-absolute bg-white border rounded shadow-sm p-2" style="z-index:10; min-width:180px; left:50%; transform:translateX(-50%); top:100%;">
                                                                    <input type="text" class="form-control form-control-sm mb-2" placeholder="Filter {{ col | titlecaseWithSpaces }}" [(ngModel)]="columnFilters[col]" (ngModelChange)="onColumnFilterChange(col)" autocomplete="off">
                                                                    <div class="d-flex justify-content-end">
                                                                        <button class="btn btn-sm btn-outline-secondary me-1" (click)="columnFilters[col]=''; onColumnFilterChange(col)">Clear</button>
                                                                        <button class="btn btn-sm btn-primary" (click)="showFilter[col]=false">OK</button>
                                                                    </div>
                                                                </div>
                                                            </th>
                                                        </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of filteredReportData; let i = index" [ngClass]="{'table-active': i % 2 === 0}">
                                <td *ngFor="let col of columns" class="text-nowrap text-center">{{ row[col] }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    <div *ngIf="!loading && !reportData.length && selectedReportType && reportSearched" class="text-center text-muted mt-4">
        <i class="bi bi-info-circle me-1"></i> No data found for the selected report.
    </div>
</div>
